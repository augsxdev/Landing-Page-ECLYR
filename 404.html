<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#191616">
  <title>404 — Página não encontrada | ÉCLYR®</title>
  <link rel="icon" type="image/png" href="/assets/symbol.png">
  <style>
    @font-face{font-family:Montserrat;src:url("/assets/Montserrat-Regular.ttf") format("truetype");font-weight:400;font-display:swap}
    @font-face{font-family:Montserrat;src:url("/assets/Montserrat-Black.ttf") format("truetype");font-weight:900;font-display:swap}
    :root{color-scheme:dark;--ink:#191616;--ivory:#f4f0df}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;background:var(--ink);color:var(--ivory);font-family:Montserrat,Arial,sans-serif}
    main{min-height:100svh;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:5vw;padding:4rem 8vw;overflow:hidden}
    .code{font-size:clamp(12rem,32vw,30rem);font-weight:900;line-height:.7;letter-spacing:-.12em;color:transparent;-webkit-text-stroke:1px rgba(244,240,223,.58)}
    .message{max-width:34rem;border-top:1px solid rgba(244,240,223,.35);padding-top:2rem}
    .label{font-size:.7rem;font-weight:700;letter-spacing:.16em}
    h1{margin:1.5rem 0;font-size:clamp(2.5rem,5vw,5rem);line-height:.9;letter-spacing:-.09em}
    p{max-width:28rem;color:rgba(244,240,223,.75);line-height:1.7}
    a{display:inline-flex;align-items:center;margin-top:1.5rem;padding:.9rem 1.1rem;border:1px solid var(--ivory);color:inherit;text-decoration:none;font-size:.72rem;font-weight:700;letter-spacing:.1em}
    a:hover{background:var(--ivory);color:var(--ink)}
    @media(max-width:680px){main{grid-template-columns:1fr;align-content:center;gap:3rem;padding:3rem 1.4rem}.code{font-size:48vw}.message{padding-top:1.5rem}h1{font-size:clamp(2.4rem,12vw,4rem)}}
  </style>
</head>
<body>
  <main>
    <div class="code" aria-hidden="true">404</div>
    <section class="message">
      <span class="label">CAMINHO NÃO ENCONTRADO</span>
      <h1>Esta página não está aqui.</h1>
      <p>O endereço pode ter mudado. Volte ao início para conhecer o trabalho da ÉCLYR.</p>
      <a href="/">VOLTAR AO INÍCIO</a>
    </section>
  </main>
</body>
</html>
